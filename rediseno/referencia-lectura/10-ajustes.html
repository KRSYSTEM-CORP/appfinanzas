<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajustes · KR POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tres módulos: Administración (Balance/Cuentas/Fiscal), Estadísticas y Caja Chica. Riel lateral en computadora, barra inferior en teléfono. */
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#1d1d1f; --ink2:#6e6e73; --line:#e6e9f1; --fill:rgba(120,120,128,.12); --track:rgba(120,120,128,.16);
  --brand:#433ddd; --brand-ink:#ffffff;
  --ok:#1f8a3c; --ok-bg:rgba(52,199,89,.14); --ok-solid:#34c759;
  --warn:#9a5b00; --warn-bg:rgba(255,159,10,.18); --warn-solid:#ff9f0a;
  --bad:#d70015; --bad-bg:rgba(255,59,48,.12); --bad-solid:#ff3b30;
  --info:#433ddd; --info-bg:rgba(67,61,221,.12);
  --c1:#433ddd; --c2:#0f9d9a; --c3:#ff9f0a; --c4:#d6407f; --c5:#7a8499; --c6:#e0a800; --c7:#1e63d6;
  --sh:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --sh-float:0 2px 4px rgba(0,0,0,.06),0 14px 36px rgba(0,0,0,.14);
  --font:'Hanken Grotesk',-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1); color-scheme:light;
}

:root[data-theme="dark"]{
  --bg:#0d0f18; --card:#171a26; --ink:#f2f3f8; --ink2:#a0a6bd; --line:#262b3d; --fill:rgba(160,166,189,.16); --track:rgba(160,166,189,.22);
  --brand:#7b76ff; --ok:#5fdc82; --warn:#ffc15c; --bad:#ff7a70; --info:#9c98ff; --c1:#7b76ff; --c2:#35c9c4; --c3:#ffc15c; --c4:#ff7fb0; --c5:#9aa3ba; --c6:#f0b90b; --c7:#5b95ff;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35); --sh-float:0 2px 4px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);letter-spacing:-.005em;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);flex-wrap:wrap}
.top b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.pill.val{background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.tbtn{border:0;background:var(--fill);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12px}
.shell{display:block}
.rail{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:14px;padding:6px 4px;font-size:11px;font-weight:700;color:var(--ink2);transition:background .15s var(--ease),color .15s var(--ease)}
.nv svg{width:22px;height:22px}
.nv[aria-pressed="true"]{background:var(--info-bg);color:var(--brand)}
@media (min-width:860px){
  .shell{display:grid;grid-template-columns:96px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:8px;padding:20px 10px;position:sticky;top:0;height:100vh;align-self:start;background:var(--card);border-right:1px solid var(--line)}
  .bottom{display:none}
  .wrap{padding-bottom:40px!important}
}
.logo{width:44px;height:44px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;margin:0 auto 10px;letter-spacing:-.04em}
.wrap{max-width:1120px;width:100%;margin:0 auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:0}
h1{margin:2px 0 0;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.05;letter-spacing:-.035em;font-weight:800}
h3{margin:0;font-size:16px;letter-spacing:-.015em}
.head{display:flex;flex-direction:column;gap:12px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:999px;font-weight:600;font-size:13px;background:var(--fill);color:var(--brand);transition:transform .15s var(--ease),background .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn svg{width:16px;height:16px}
.mini{border:0;background:transparent;color:var(--brand);font-weight:600;font-size:13px;padding:6px 8px;border-radius:999px}
.mini:hover{background:var(--fill)}
.card{background:var(--card);border-radius:19px;box-shadow:var(--sh);padding:16px;min-width:0;position:relative}
.card.flush{padding:0;overflow:hidden}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card header p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{position:relative;text-align:left;background:var(--card);border:2px solid transparent;border-radius:19px;padding:17px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;min-height:128px;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-float)}
.kpi .lbl{font-size:12px;font-weight:600;text-transform:uppercase;color:var(--ink2);padding-right:44px}
.kpi .num{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .hint{font-size:13px;color:var(--ink2)}
.kpi .ic{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:999px;display:grid;place-items:center}
.kpi .ic svg{width:18px;height:18px}
.k-all{color:var(--info)}.k-all .ic{background:var(--info-bg)}
.k-ok{color:var(--ok)}.k-ok .ic{background:var(--ok-bg)}
.k-warn{color:var(--warn)}.k-warn .ic{background:var(--warn-bg)}
.k-bad{color:var(--bad)}.k-bad .ic{background:var(--bad-bg)}
/* navegación interna */
.groups{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.groups .gp{flex:1 0 150px;scroll-snap-align:start}
.gp{text-align:left;border:2px solid transparent;background:var(--card);border-radius:19px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:4px;transition:transform .15s var(--ease),background .15s var(--ease),color .15s var(--ease)}
.gp b{font-size:16px;letter-spacing:-.02em}.gp small{color:var(--ink2);font-size:12px;line-height:1.3}
.gp svg{width:22px;height:22px;color:var(--brand)}
.gp[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.gp[aria-pressed="true"] small,.gp[aria-pressed="true"] svg{color:var(--brand-ink);opacity:.9}
@media (max-width:560px){.gp small{display:none}.groups .gp{flex:0 0 118px;padding:12px}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;border:2px solid transparent;border-radius:12px;padding:0 14px;font-weight:700;font-size:13px;background:var(--fill);color:var(--ink);transition:background .15s var(--ease),color .15s var(--ease)}
.chip[aria-pressed="true"]{background:var(--info-bg);color:var(--brand);border-color:var(--brand)}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:34px;padding:0 14px;font-weight:700;font-size:13px;color:var(--ink2);transition:background .15s var(--ease),color .15s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
/* tablas */
.scroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.tb{width:100%;border-collapse:collapse;min-width:520px}
.tb th{font-size:12px;font-weight:700;color:var(--ink2);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb .r{text-align:right}.tb td.r,.tb td.num{font-variant-numeric:tabular-nums}
.tb tfoot td{font-weight:800;border-top:2px solid var(--line)}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:999px;background:currentColor}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.warn{background:var(--warn-bg);color:var(--warn)}.st.bad{background:var(--bad-bg);color:var(--bad)}
.meter{height:8px;border-radius:999px;background:var(--track);overflow:hidden;min-width:60px}
.meter span{display:block;height:100%;border-radius:999px;transition:width .3s var(--ease)}
.meter.ok span{background:var(--ok-solid)}.meter.warn span{background:var(--warn-solid)}.meter.bad span{background:var(--bad-solid)}.meter.brand span{background:var(--brand)}
.hb{display:grid;grid-template-columns:minmax(80px,1.1fr) 3fr auto;gap:10px;align-items:center;padding:7px 0}
.hb .nm{font-weight:600;font-size:13px;overflow-wrap:anywhere}.hb .vl{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;text-align:right;min-width:62px}
.stack{display:flex;height:22px;border-radius:999px;overflow:hidden;gap:2px;background:var(--track)}
.stack span{display:block;height:100%;transition:width .3s var(--ease)}
.dot{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:8px;flex:none}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li small{color:var(--ink2);display:block}.li .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.li>div{min-width:0}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.muted{color:var(--ink2)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.note{font-size:13px;color:var(--ink2);margin:8px 0 0}
.svgbox{width:100%;height:auto;display:block;max-height:340px}
.svgbox text{font-family:var(--font);fill:var(--ink2);font-size:12px}
.svgbox .v{fill:var(--ink);font-weight:700}
.stars{display:inline-flex;gap:2px}.stars button{border:0;background:transparent;padding:2px;font-size:20px;line-height:1;color:var(--track)}
.stars button.on{color:var(--warn-solid)}
.eq{position:relative;height:30px;border-radius:999px;background:var(--track);margin:34px 0 8px}
.eq .f{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ok-solid)}
.eq .p{position:absolute;left:0;top:6px;bottom:6px;border-radius:999px;border:2px dashed var(--brand);opacity:.7}
.eq .mk{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--ink);border-radius:2px}
.eq .mk em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:12px;font-weight:700;margin-bottom:2px}
.acc{display:flex;flex-direction:column;gap:6px}
.acc .bal{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pulse{animation:pulse .9s var(--ease)}
@keyframes pulse{0%{background:var(--ok-bg)}100%{background:transparent}}
select,.in{min-height:42px;border:0;border-radius:999px;background:var(--fill);color:inherit;font:inherit;padding:0 14px}
/* calor */
.hmw{overflow-x:auto;padding-bottom:4px}
.hm{display:grid;grid-template-columns:44px repeat(13,minmax(30px,1fr));gap:3px;min-width:520px}
.hm .hl{font-size:11px;color:var(--ink2);text-align:center;font-weight:600}
.hm .dl{font-size:12px;font-weight:700;display:flex;align-items:center}
.hm button.c{border:0;height:30px;border-radius:7px;padding:0;background:var(--c);transition:transform .15s var(--ease)}
.hm button.c:hover,.hm button.c:focus-visible{transform:scale(1.18);position:relative;z-index:2}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:var(--sh-float);display:none}
.leg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-top:10px}
.leg i{flex:0 0 140px;height:10px;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 8%,var(--card)),var(--brand))}
.find{display:flex;flex-direction:column;gap:8px}
.find .ic{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}
.find .ic svg{width:18px;height:18px}
/* conteo */
.den{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.den label{background:var(--fill);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;font-weight:700}
.den input{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:inherit;padding:0 8px;width:100%}
.den small{color:var(--ink2);font-weight:500}
.diff{margin-top:12px;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700;flex-wrap:wrap}
.diff.ok{background:var(--ok-bg);color:var(--ok)}.diff.warn{background:var(--warn-bg);color:var(--warn)}.diff.bad{background:var(--bad-bg);color:var(--bad)}
/* ticket térmico */
.tkw{overflow:hidden;display:flex;justify-content:center;padding:18px 0 14px;background:var(--fill);border-radius:14px;min-height:120px}
.ticket{--paper:#ffffff;position:relative;background:var(--paper);color:#111;font:12px/1.5 ui-monospace,'SF Mono',Menlo,Consolas,monospace;padding:18px 14px;margin:6px 0;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:width .25s var(--ease)}
.ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:6px;background-size:12px 6px;background-repeat:repeat-x}
.ticket::before{top:-6px;background-image:conic-gradient(from -45deg at bottom,transparent 0,var(--paper) 0 90deg,transparent 0)}
.ticket::after{bottom:-6px;background-image:conic-gradient(from 135deg at top,transparent 0,var(--paper) 0 90deg,transparent 0)}
.ticket.printing{animation:print 1.1s steps(18,end)}
@keyframes print{from{transform:translateY(-105%)}to{transform:none}}
.ticket .c{text-align:center}.ticket .rw{display:flex;justify-content:space-between;gap:8px}.ticket hr{border:0;border-top:1px dashed #111;margin:7px 0}
.ticket .b{font-weight:800}
/* hojas, toasts */
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.4);display:none;z-index:40}
.scrim.on{display:block;animation:fade .15s var(--ease)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--sh-float);padding:18px 18px 22px;transform:translateY(105%);visibility:hidden;transition:transform .25s var(--ease),visibility .25s;max-height:88vh;overflow:auto}
.sheet.on{transform:none;visibility:visible}
.sheet h2{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}.sheet p{margin:0;color:var(--ink2)}
.grab{width:40px;height:4px;border-radius:999px;background:var(--track);margin:0 auto 12px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-weight:600;font-size:13px}
.field input,.field select{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:inherit;font:inherit;padding:0 12px;width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--sh-float);font-weight:600;animation:bubble .25s var(--ease);max-width:calc(100vw - 32px)}
@media (max-width:859px){.toast{bottom:92px}}
@keyframes bubble{from{opacity:0;transform:translate(-50%,-10px) scale(.96)}to{opacity:1;transform:translateX(-50%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.view{animation:rowin .2s var(--ease)}
@keyframes rowin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* bloqueo */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lock.on{display:flex}
.clock{font-size:clamp(3rem,14vw,5rem);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:14px;margin:8px 0}.dots i{width:14px;height:14px;border-radius:999px;border:2px solid var(--ink2)}.dots i.on{background:var(--brand);border-color:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--sh);font-size:26px;font-weight:700;transition:transform .15s var(--ease)}
.pad button:active{transform:scale(.94)}.pad .sp{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---- ampliación: menú ⋯, CRM, nómina ---- */
.seg{max-width:100%}
.am{width:36px;height:36px;border:0;border-radius:999px;background:transparent;color:var(--ink2);display:inline-grid;place-items:center;transition:background .15s var(--ease)}
.am:hover,.am[aria-expanded="true"]{background:var(--fill);color:var(--ink)}
.am svg{width:20px;height:20px}
.amenu{position:fixed;z-index:60;min-width:210px;background:var(--card);border-radius:16px;box-shadow:var(--sh-float);border:1px solid var(--line);padding:6px;display:none;animation:rowin .15s var(--ease)}
.amenu.on{display:block}
.amenu .mi{display:flex;align-items:center;width:100%;min-height:40px;border:0;background:transparent;border-radius:10px;padding:0 12px;text-align:left;font-weight:600;font-size:14px}
.amenu .mi:hover,.amenu .mi:focus-visible{background:var(--fill);outline:none}
.amenu .mi.danger{color:var(--bad)}
.amenu .grab{display:none}
.amenu.bs{left:0!important;right:0;top:auto!important;bottom:0;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:12px 14px 22px;z-index:61}
.amenu.bs .grab{display:block}
.amenu.bs .mi{min-height:48px;font-size:15px}
.amscrim{position:fixed;inset:0;z-index:59;background:rgba(10,14,30,.35);display:none}
.amscrim.on{display:block}
.sw{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;font-weight:600;font-size:13px;padding:4px 0;text-align:left}
.sw i{flex:none;width:44px;height:26px;border-radius:999px;background:var(--track);position:relative;transition:background .15s var(--ease)}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s var(--ease)}
.sw[aria-checked="true"] i{background:var(--ok-solid)}.sw[aria-checked="true"] i::after{transform:translateX(18px)}
.q2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qk{text-align:left;border:2px solid transparent;border-radius:16px;padding:14px;background:var(--fill);display:flex;flex-direction:column;gap:2px}
.qk b{font-size:15px}.qk .n{font-size:26px;font-weight:800;letter-spacing:-.03em}.qk small{color:var(--ink2)}
.qk[aria-pressed="true"]{border-color:var(--brand);background:var(--info-bg)}
.qk.c1{background:color-mix(in srgb,var(--ok-solid) 16%,var(--card))}.qk.c2{background:color-mix(in srgb,var(--c1) 14%,var(--card))}.qk.c3{background:color-mix(in srgb,var(--warn-solid) 20%,var(--card))}.qk.c4{background:var(--fill)}
