# Ajustes para un servidor de 8 GB de RAM (CX33). Subir con el tamaño del servidor.
listen_addresses = '*'          # el acceso real lo limita pg_hba.conf y el firewall
max_connections = 100
password_encryption = scram-sha-256
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 512MB
wal_level = replica
max_wal_size = 2GB
checkpoint_timeout = 15min
random_page_cost = 1.1
timezone = 'UTC'
log_timezone = 'UTC'
log_min_duration_statement = 500   # registra consultas de más de 0,5 s
log_connections = off
log_checkpoints = on
