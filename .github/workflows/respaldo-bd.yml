name: Respaldo de la base de datos

# Copia cifrada de la base de datos cada 6 horas, a Cloudflare R2 (principal) y a
# Backblaze B2 (segunda copia, otro proveedor). Funciona con la base que esté en
# BACKUP_DATABASE_URL: hoy Neon, mañana el Postgres del servidor propio.
# Guía de configuración y de restauración: docs/infra/respaldos.md

on:
  schedule:
    - cron: "17 */6 * * *" # UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo-bd
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      BACKUP_HEALTHCHECK_URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}
    steps:
      - name: Comprobar configuración
        id: cfg
        run: |
          missing=""
          for v in BACKUP_DATABASE_URL BACKUP_AGE_PUBLIC_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Faltan secretos:$missing. Respaldo omitido (ver docs/infra/respaldos.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar herramientas
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone

      - name: Copia de la base de datos (pg_dump)
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # verify-full exige un certificado raíz que el contenedor no tiene: se usa
          # require (la conexión sigue cifrada), sea cual sea la cadena que se pegó.
          export PGURL=$(printf '%s' "$BACKUP_DATABASE_URL" | sed -E 's/sslmode=(verify-full|verify-ca)/sslmode=require/')
          # pg_dump de una versión igual o mayor que el servidor puede copiar servidores más viejos.
          docker run --rm -e PGURL postgres:18-alpine sh -c 'pg_dump --format=custom --no-owner "$PGURL"' > "bd-$STAMP.dump"
          test -s "bd-$STAMP.dump"
          # Comprobación mínima: que el archivo se pueda leer y traiga las tablas.
          TABLES=$(docker run --rm -i postgres:18-alpine pg_restore --list < "bd-$STAMP.dump" | grep -c " TABLE " || true)
          echo "Tablas en la copia: $TABLES"
          # La base de producción tiene más de 35 tablas: menos indica que se está
          # copiando otra base (más vieja o equivocada).
          if [ "$TABLES" -lt 35 ]; then
            echo "::error::La copia trae solo $TABLES tablas; algo salió mal."
            exit 1
          fi
          age -r "$BACKUP_AGE_PUBLIC_KEY" -o "bd-$STAMP.dump.age" "bd-$STAMP.dump"
          rm -f "bd-$STAMP.dump"
          ls -lh "bd-$STAMP.dump.age"

      - name: Subir a R2 (principal)
        if: steps.cfg.outputs.ok == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail
          rclone copyto "bd-$STAMP.dump.age" "r2:$R2_BUCKET/bd/bd-$STAMP.dump.age" --retries 3 -q
          COUNT=$(rclone lsf "r2:$R2_BUCKET/bd" | wc -l)
          echo "R2: $COUNT copias guardadas"
          # Solo se borra lo viejo si hay suficientes copias recientes (nunca se vacía el bucket).
          if [ "$COUNT" -gt 20 ]; then rclone delete "r2:$R2_BUCKET/bd" --min-age 30d -q; fi

      - name: Subir a Backblaze B2 (segunda copia)
        if: steps.cfg.outputs.ok == 'true' && env.B2_KEY_ID != '' && env.B2_APPLICATION_KEY != '' && env.B2_BUCKET != ''
        env:
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          rclone copyto "bd-$STAMP.dump.age" "b2:$B2_BUCKET/bd/bd-$STAMP.dump.age" --retries 3 -q
          COUNT=$(rclone lsf "b2:$B2_BUCKET/bd" | wc -l)
          echo "B2: $COUNT copias guardadas"
          if [ "$COUNT" -gt 20 ]; then rclone delete "b2:$B2_BUCKET/bd" --min-age 30d -q; fi

      - name: Avisar que el respaldo salió bien
        if: success() && steps.cfg.outputs.ok == 'true' && env.BACKUP_HEALTHCHECK_URL != ''
        run: curl -fsS -m 15 --retry 3 "$BACKUP_HEALTHCHECK_URL" > /dev/null

      - name: Avisar que el respaldo falló
        if: failure() && env.BACKUP_HEALTHCHECK_URL != ''
        run: curl -fsS -m 15 --retry 3 "$BACKUP_HEALTHCHECK_URL/fail" > /dev/null || true
