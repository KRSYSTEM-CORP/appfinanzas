name: Desplegar en el servidor propio

# Manual a propósito: tú decides cuándo y qué versión. Para volver atrás, vuelve a
# correrlo con la versión (tag) anterior. Las migraciones NO corren aquí: se lanzan
# aparte y con aprobación (docs/infra/runbook-servidor.md).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión de la imagen (por defecto, el commit)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  construir:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "tag=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen de la app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ghcr.io/krsystem-corp/appfinanzas:${{ steps.t.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Imagen de migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/krsystem-corp/appfinanzas-migrate:${{ steps.t.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment: produccion # protegido: exige tu aprobación
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
    steps:
      - name: Comprobar configuración
        run: |
          for v in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Falta el secreto $v (ver docs/infra/runbook-servidor.md)"; exit 1; }
          done
      - name: Desplegar
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          TAG="${{ needs.construir.outputs.tag }}"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes deploy@"$DEPLOY_HOST" "bash -s" <<EOF
          set -euo pipefail
          cd /opt/kr
          if [ -n "${GHCR_READ_TOKEN:-}" ]; then echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u krsystem-corp --password-stdin; fi
          cp .current-tag .previous-tag 2>/dev/null || true
          export TAG="$TAG"
          docker compose pull app
          docker compose up -d app caddy
          for i in \$(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then echo "App sana con la versión \$TAG"; echo "\$TAG" > .current-tag; exit 0; fi
            sleep 4
          done
          echo "La app no respondió; revisa 'docker compose logs app'" >&2
          exit 1
          EOF
