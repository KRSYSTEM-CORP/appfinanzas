name: CI

on:
  pull_request:
  push:
    branches: [main]

# prisma.config.ts requires DIRECT_URL even for `prisma generate` (run by
# npm ci's postinstall). Placeholder only: nothing here connects to it.
env:
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --omit=dev --audit-level=critical
